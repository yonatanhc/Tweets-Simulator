# Egress mínimo: DNS + CipherTrust en 9085. Si el cluster no usa NetworkPolicies, igual
# hay que pedir apertura de firewall/SG del cluster hacia los CIDR de CipherTrust:9085.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crypto-bridge-egress
spec:
  podSelector:
    matchLabels: { app: crypto-bridge-svc }
  policyTypes: [Egress]
  egress:
    - ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - ports: [{ port: 9085, protocol: TCP }]

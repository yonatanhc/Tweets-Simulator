apiVersion: apps/v1
kind: Deployment
metadata:
  name: crypto-bridge-svc
  labels: { app: crypto-bridge-svc }
spec:
  replicas: 2
  selector:
    matchLabels: { app: crypto-bridge-svc }
  template:
    metadata:
      labels: { app: crypto-bridge-svc }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      # Los Secrets se montan como root; con 0400 el usuario 10001 no podría leerlos.
      # El initContainer los copia a un emptyDir como appuser y aplica chmod 400 (exigido por la guía).
      initContainers:
        - name: gemalto-files
          image: busybox:1.36
          command: ["sh", "-c", "cp /src/* /frgmount/gemalto/ && chmod 400 /frgmount/gemalto/*"]
          volumeMounts:
            - { name: gemalto-src, mountPath: /src, readOnly: true }
            - { name: gemalto-vol, mountPath: /frgmount/gemalto }
      containers:
        - name: app
          image: REGISTRY/crypto-bridge-svc:TAG   # lo reemplaza el pipeline
          ports: [{ containerPort: 8080 }]
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: k8s }
            - { name: GEMALTO_VOLUME, value: /frgmount/gemalto }
          envFrom:
            - configMapRef: { name: crypto-bridge-config }
            - secretRef: { name: crypto-bridge-secrets }
          volumeMounts:
            - { name: gemalto-vol, mountPath: /frgmount/gemalto }
            - { name: cadp-cache, mountPath: /var/cache/cadp }   # Persistent_Cache_Directory
            - { name: tmp, mountPath: /tmp }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 768Mi }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 15
            timeoutSeconds: 10
      volumes:
        - name: gemalto-src
          secret: { secretName: gemalto-files }
        - { name: gemalto-vol, emptyDir: { medium: Memory, sizeLimit: 5Mi } }
        - { name: cadp-cache, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: crypto-bridge-svc
spec:
  selector: { app: crypto-bridge-svc }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: crypto-bridge-config
data:
  GEMALTO_ENCRYPTION_KEY: "PApp_<APPNAME>_DEV_Key"
  TOKENIZATION_ENABLED: "false"

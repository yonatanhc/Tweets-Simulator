spring:
  application:
    name: crypto-bridge-svc
  profiles:
    default: local

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints.web.exposure.include: health,info
  endpoint.health:
    probes.enabled: true
    group:
      readiness.include: readinessState,cipherTrust
      liveness.include: livenessState   # nunca atar liveness a CipherTrust

logging.level:
  com.wu.era: INFO

crypto.api-key.enabled: false
era.secretsmanager.enabled: false     # ver EraSecretsManagerConfig

# Valores comunes (DEV). <APPNAME>/<ENV> los asigna el equipo EKM en el onboarding.
common:
  gemalto:
    nae_ip1: ctmdevnv.sharedservices.awswuintranet.net:WANV-SHS-0-CTM-ELB-5a063879762edde4.elb.us-east-1.amazonaws.com
    nae_ip2: ctmdevoh.sharedservices.awswuintranet.net:WAOH-SHS-0-CTM-ELB-2f184896540af230.elb.us-east-2.amazonaws.com
    nae_port: 9085
    nae_template: true
    encryptionKey: ${GEMALTO_ENCRYPTION_KEY:PApp_<APPNAME>_DEV_Key}
    # Mismo nombre de objeto que en S3. Si el archivo ya existe en "volume",
    # la librería NO lo descarga de S3 (según la guía).
    nae_file: s3://<Bucketname>/<folder>/CADP_for_JAVA.properties
    keystore_file: s3://<Bucketname>/<folder>/client_keystore_<APPNAME>-DEV-Cluster_PApp-<APPNAME>-DEV.jks
    volume: ${GEMALTO_VOLUME:/frgmount/gemalto}
    cache_enabled: true
    log_file: /dev/stdout
    log_level: LOW
    region: us-east-1
    # Secretos de Nivel 1 (ofuscados con Passphrase.jar), nunca en claro ni en git
    NAE:
      username: ${NAE_USERNAME}
      password: ${NAE_PASSWORD}
    Key_Store_Password:
      password: ${KEYSTORE_PASSWORD}
    # HMAC: solo si lo necesitan
    cipherTrustEncryption: false
    encryptionHMACKey: ${GEMALTO_HMAC_KEY:}
  security:
    crypto:
      tokenization: ${TOKENIZATION_ENABLED:false}
      tokenizeKey: ${TOKENIZE_KEY:}
      tokenFormat: LAST_FOUR_TOKEN

---
spring.config.activate.on-profile: local
common.gemalto:
  volume: ${GEMALTO_VOLUME:${user.dir}/local/gemalto}
  log_level: HIGH

---
# Sin CipherTrust: prueba del contrato HTTP. GemaltoConfig no se carga.
spring.config.activate.on-profile: mock
management.endpoint.health.group.readiness.include: readinessState

---
spring.config.activate.on-profile: k8s
crypto.api-key:
  enabled: true
  value: ${CRYPTO_API_KEY}
